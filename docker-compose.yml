services:

  caddy:
    image: caddy:2
    container_name: caddy
    ports:
      - "${CADDY_HTTP:-3000:3000}"   # dev: 3000:3000 (http://localhost:3000); prod: 80:80
      - "${CADDY_HTTPS:-3001:443}"   # prod: 443:443; dev: dormant high port
    restart: unless-stopped
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/data:/data
      - ./caddy/config:/config
      - /etc/localtime:/etc/localtime:ro

  wspomo:
    image: ${IMAGE:-wspomo:local}    # dev: image built by hand (docker build -t wspomo:local .)
                                     # prod: ghcr.io/phantomcat/wspomo:latest (from .env)
                                     # compose never builds — image is built or pulled separately
    container_name: wspomo
    expose:
      - 3000
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://wspomo:${POSTGRES_PASSWORD:-wspomo}@postgres:5432/wspomo
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000"]
      # 127.0.0.1, not localhost: in the container localhost resolves to ::1,
      # while the server listens on IPv4 only → perpetual unhealthy
      interval: 30s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: wspomo-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=wspomo
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-wspomo}
      - POSTGRES_DB=wspomo
    volumes:
      - pgdata:/var/lib/postgresql/data
    # tuned down for small VPS (KT-1: shared_buffers modest); wal stays default
    command: postgres -c shared_buffers=128MB -c max_connections=40
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wspomo -d wspomo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: