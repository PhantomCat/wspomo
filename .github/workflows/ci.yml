name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write # ghcr.io push

jobs:
  test:
    name: tests (node 20)
    runs-on: ubuntu-latest
    services:
      postgres: # KT-1 storage — storage tests run against a real database
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wspomo
          POSTGRES_PASSWORD: wspomo
          POSTGRES_DB: wspomo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wspomo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgres://wspomo:wspomo@127.0.0.1:5432/wspomo

  docker:
    name: docker build (+ push ghcr on main)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t wspomo:ci .
      - name: sanity — server boots and /api/state answers (file-backed)
        run: |
          docker run -d --name wspomo-sanity -p 3000:3000 wspomo:ci
          sleep 2
          curl -sf http://127.0.0.1:3000/api/state > /dev/null
          docker rm -f wspomo-sanity
      - name: login to ghcr
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: tag and push ghcr.io/phantomcat/wspomo:latest
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          docker tag wspomo:ci ghcr.io/${{ github.repository_owner }}/wspomo:latest
          docker push ghcr.io/${{ github.repository_owner }}/wspomo:latest